<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#172937">
    <meta name="robots" content="noindex">
    <title>Pocket District</title>
    <link rel="icon" href="data:,">
    <style>
        html, body, #GameDiv, #Cocos3dGameContainer {
            width: 100%; height: 100%; margin: 0; overflow: hidden;
        }
        body { background: #eac397; color: #172937; font: 600 16px system-ui, sans-serif; }
        canvas { display: block; outline: none; touch-action: none; }
        #status {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            min-width: 204px; max-width: 80vw; padding: 16px 22px; border-radius: 12px;
            background: #172937; color: #fff6dc; text-align: center; z-index: 1;
        }
    </style>
    <script src="./system.js"></script>
    <script type="importmap">{"imports":{"cc":"./cc-adapter.js"}}</script>
</head>
<body>
    <div id="GameDiv"><div id="Cocos3dGameContainer"><canvas id="GameCanvas" tabindex="0" aria-label="Pocket District"></canvas></div></div>
    <div id="status" role="status">Đang tải khu phố…</div>
    <noscript>Bật JavaScript để chơi Pocket District.</noscript>
    <script type="module">
        import('./boot.js').catch(error => {
            document.getElementById('status').textContent = 'Không mở được game. Thử tải lại trang bằng trình duyệt có WebGL 2.';
            console.error(error);
        });
    </script>
</body>
</html>
